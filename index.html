<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#13203d;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.gate{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0a1530 0%,#1b2f6b 100%)}
.card{width:100%;max-width:400px;background:#fff;border-radius:26px;padding:28px 24px 24px;box-shadow:0 40px 90px -40px #000a}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px}
label.l{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px}
.in{display:flex;align-items:center;border:2px solid #dde3ee;border-radius:14px;background:#fff}
.in:focus-within{border-color:#2b8bd0;box-shadow:0 0 0 4px rgba(43,139,208,.18)}
.in input{flex:1;min-width:0;border:0;background:transparent;height:52px;padding:0 14px;font:inherit;font-size:17px;font-weight:600;outline:none;color:inherit}
.in button{font:inherit;font-weight:700;font-size:13px;color:#1356a4;padding:0 14px;height:52px;background:none;border:0;cursor:pointer}
.rem{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;font-weight:600;color:#5b6577;cursor:pointer}
.rem input{width:20px;height:20px;accent-color:#1356a4}
.err{min-height:22px;margin-top:12px;color:#c0392b;font-weight:700;font-size:14px}
.btn{width:100%;height:50px;margin-top:6px;border:0;border-radius:14px;background:#e69a1c;color:#13203d;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
small{display:block;margin-top:16px;text-align:center;color:#5b6577;font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="card" id="f" autocomplete="on">
    <h2>Kirjaudu sisään</h2>
    <label class="l" for="user">Käyttäjätunnus</label>
    <div class="in"><input id="user" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
    <label class="l" for="pass">Salasana</label>
    <div class="in"><input id="pass" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" id="show">Näytä</button></div>
    <label class="rem"><input type="checkbox" id="rem" checked> Pysy kirjautuneena tällä laitteella</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">Kirjaudu</button>
    <small>Kirjautuminen säilyy tällä laitteella, kunnes kirjaudut ulos.</small>
  </form>
</div>

<script>
(function(){
"use strict";
var P=JSON.parse(document.getElementById("payload").textContent),KEY="k1";
var $=function(i){return document.getElementById(i)};
var subtle=window.crypto&&window.crypto.subtle;
function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function b64e(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function decrypt(raw){
  return subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){
    return subtle.decrypt({name:"AES-GCM",iv:b64d(P.i)},k,b64d(P.d))}).then(function(pt){return new TextDecoder().decode(pt)});
}
function derive(u,p){
  var pw=new TextEncoder().encode(u.normalize("NFC").trim().toLowerCase()+"\u0000"+p.normalize("NFC"));
  return subtle.importKey("raw",pw,"PBKDF2",false,["deriveBits"]).then(function(km){
    return subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(P.s),iterations:P.n},km,256)}).then(function(b){return new Uint8Array(b)});
}
function show(html){document.open();document.write(html);document.close()}
function saved(){try{return sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(e){return null}}
function forget(){try{sessionStorage.removeItem(KEY)}catch(e){}try{localStorage.removeItem(KEY)}catch(e){}}
if(!subtle){$("err").textContent="Avaa sivu https-osoitteella.";$("go").disabled=true;return}
var tok=saved();
if(tok){
  $("gate").hidden=true;
  decrypt(b64d(tok)).then(show,function(){forget();$("gate").hidden=false});
}
$("show").addEventListener("click",function(){var p=$("pass"),s=p.type==="password";p.type=s?"text":"password";this.textContent=s?"Piilota":"Näytä"});
var fails=0;
$("f").addEventListener("submit",function(e){
  e.preventDefault();var b=$("go"),er=$("err");if(b.disabled)return;
  b.disabled=true;b.textContent="Tarkistetaan…";er.textContent="";
  derive($("user").value,$("pass").value).then(function(raw){
    return decrypt(raw).then(function(html){
      var s=$("rem").checked?localStorage:sessionStorage;try{s.setItem(KEY,b64e(raw))}catch(x){}
      show(html);
    });
  }).catch(function(){
    fails++;er.textContent="Väärä käyttäjätunnus tai salasana.";$("pass").value="";
    var wait=fails>=3?Math.min(30,(fails-2)*3):0;
    if(wait){var left=wait;(function tick(){b.textContent="Odota "+left+" s";if(left--<=0){b.disabled=false;b.textContent="Kirjaudu";return}setTimeout(tick,1000)})()}
    else{b.disabled=false;b.textContent="Kirjaudu"}
  });
});
})();
</script>
